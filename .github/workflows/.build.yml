name: Build EXE

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build
      - run: npx electron-builder --win

      - uses: actions/upload-artifact@v4
        with:
          name: OBS-Lite-Neon
          path: dist/*.exe