name: Build EXE

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Build do Vite
        run: npm run build

      - name: Gerar EXE
        run: npx electron-builder --win

      - name: Upload do EXE
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Lite-Neon
          path: dist/*.exe